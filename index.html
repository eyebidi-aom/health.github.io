<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Health Tracking BIDI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --mint-dark: #129272;
            --mint-primary: #20c997;
            --mint-light: #d1f2eb;
            --mint-bg: #f2fcf9;
        }
        body { background-color: var(--mint-bg); font-family: 'Prompt', sans-serif; font-size: 1.1rem; color: #333; }
        .max-w-md { max-width: 600px; margin: 0 auto; }
        .card { border-radius: 20px; border: none; box-shadow: 0 8px 20px rgba(32, 201, 151, 0.1); }
        .greeting-box { background: linear-gradient(135deg, var(--mint-primary) 0%, var(--mint-dark) 100%); color: white; border-radius: 20px; padding: 25px; }
        .nav-pills .nav-link { color: var(--mint-dark); font-size: 1rem; font-weight: 500; border-radius: 12px; padding: 10px 5px;}
        .nav-pills .nav-link.active { background-color: var(--mint-primary); color: white; }
        .form-label { font-weight: 500; color: var(--mint-dark); font-size: 1.1rem; }
        .form-control, .form-select { border-radius: 12px; border: 2px solid var(--mint-light); padding: 10px; font-size: 1rem; }
        .form-control:focus, .form-select:focus { border-color: var(--mint-primary); box-shadow: 0 0 0 0.25rem rgba(32, 201, 151, 0.25); }
        .btn-custom { background-color: var(--mint-primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 500; padding: 12px; transition: all 0.3s; }
        .btn-custom:hover { background-color: var(--mint-dark); color: white; }
        .birthday-banner { background-color: #ff7675; color: white; border-radius: 15px; padding: 15px; animation: pop 0.5s ease-out; }
        .ai-box { background-color: white; border-left: 5px solid var(--mint-primary); padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);}
        
        /* สไตล์ตารางและปุ่มจัดการ */
        .table-rounded-wrapper { border-radius: 1rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border: 1px solid #e2e8f0; background: white; }
        .table { margin-bottom: 0; }
        .table thead { background-color: #f8fafc; color: #475569; font-size: 0.95rem; }
        .table th, .table td { padding: 1rem; vertical-align: middle; border-bottom: 1px solid #f1f5f9; }
        .table tbody tr:last-child td { border-bottom: none; }
        .table tbody tr:hover { background-color: var(--mint-light); }
        
        .chart-container { position: relative; height: 250px; width: 100%; margin-bottom: 20px; }
        
        /* สไตล์ปุ่มแก้ไขและปุ่มลบ */
        .btn-edit { background-color: #f1f5f9; color: #64748b; border: none; border-radius: 8px; padding: 5px 10px; font-size: 0.9rem; transition: all 0.2s; }
        .btn-edit:hover { background-color: var(--mint-primary); color: white; }
        .btn-delete { background-color: #fee2e2; color: #ef4444; border: none; border-radius: 8px; padding: 5px 10px; font-size: 0.9rem; transition: all 0.2s; margin-left: 4px; }
        .btn-delete:hover { background-color: #ef4444; color: white; }
        
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div class="container py-4 max-w-md">
    <!-- แบนเนอร์วันเกิด -->
    <div id="birthdayBanner" class="birthday-banner mb-3 d-none text-center shadow-sm">
        <h4 class="mb-1">🎉 สุขสันต์วันเกิด! 🎂</h4>
        <p class="mb-0 fs-5">ขอให้คุณ <span id="bdName"></span> สุขภาพร่างกายแข็งแรง ปราศจากโรคภัยนะครับ</p>
    </div>

    <!-- กล่องทักทาย -->
    <div class="greeting-box mb-4 shadow">
        <h3 id="greetingText"><i class="bi bi-person-heart"></i> สวัสดี ผู้ใช้งาน!</h3>
        <p class="mb-1 fs-6" id="diseaseText"></p>
        <p class="mb-2 fs-5" id="dateText"></p>
        <hr class="border-light opacity-50">
        <div class="d-flex align-items-center mt-2">
            <i id="weatherIcon" class="bi bi-cloud-sun fs-1 me-3"></i>
            <div>
                <strong class="fs-4" id="tempText">กำลังโหลดสภาพอากาศ...</strong>
                <p class="mb-0 text-white-50"><i class="bi bi-geo-alt-fill"></i> จ.นนทบุรี</p>
                <p class="mb-0 fs-6 mt-1" id="weatherSuggestion"></p>
            </div>
        </div>
    </div>

    <!-- เมนูนำทาง -->
    <ul class="nav nav-pills nav-justified mb-4 shadow-sm p-1 rounded-4 bg-white" id="pills-tab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-record" type="button"><i class="bi bi-pencil-square"></i> บันทึก</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-history" type="button" onclick="renderHistory()"><i class="bi bi-graph-up"></i> ประวัติ</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-ai" type="button" onclick="renderAIAnalysis()"><i class="bi bi-robot"></i> AI</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-settings" type="button"><i class="bi bi-gear"></i> ตั้งค่า</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        
        <!-- 1. หน้าบันทึกข้อมูล -->
        <div class="tab-pane fade show active" id="pills-record">
            <div class="card p-4">
                <form id="healthForm">
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">วันที่</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">เวลา</label>
                            <input type="time" class="form-control" id="time" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">RR <small class="text-muted">(ครั้ง/นาที)</small></label>
                            <input type="number" class="form-control" id="rr" placeholder="เช่น 20">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Pulse <small class="text-muted">(ครั้ง/นาที)</small></label>
                            <input type="number" class="form-control" id="p" placeholder="เช่น 80">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label text-danger">SBP <small class="text-muted">(ตัวบน)</small></label>
                            <input type="number" class="form-control" id="sbp" placeholder="เช่น 120" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-primary">DBP <small class="text-muted">(ตัวล่าง)</small></label>
                            <input type="number" class="form-control" id="dbp" placeholder="เช่น 80" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">หมายเหตุ</label>
                        <textarea class="form-control" id="note" rows="2" placeholder="ระบุอาการเพิ่มเติม (ถ้ามี)"></textarea>
                    </div>
                    <button type="submit" class="btn btn-custom w-100 shadow-sm" id="submitBtn">
                        <i class="bi bi-cloud-arrow-up"></i> บันทึกข้อมูล
                    </button>
                </form>
            </div>
        </div>

        <!-- 2. หน้าประวัติและกราฟ -->
        <div class="tab-pane fade" id="pills-history">
            <div class="card p-4 bg-transparent shadow-none px-0">
                <h4 class="mb-3 px-2" style="color: var(--mint-dark);"><i class="bi bi-journal-medical"></i> ประวัติสุขภาพ</h4>
                
                <div class="row mb-4 px-2">
                    <div class="col-6">
                        <select id="filterMonth" class="form-select border-0 shadow-sm" onchange="renderHistory()">
                            <option value="01">มกราคม</option> <option value="02">กุมภาพันธ์</option> <option value="03">มีนาคม</option>
                            <option value="04">เมษายน</option> <option value="05">พฤษภาคม</option> <option value="06">มิถุนายน</option>
                            <option value="07">กรกฎาคม</option> <option value="08">สิงหาคม</option> <option value="09">กันยายน</option>
                            <option value="10">ตุลาคม</option> <option value="11">พฤศจิกายน</option> <option value="12">ธันวาคม</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <select id="filterYear" class="form-select border-0 shadow-sm" onchange="renderHistory()"></select>
                    </div>
                </div>

                <!-- ตารางข้อมูลโค้งมน -->
                <div class="table-rounded-wrapper mb-4">
                    <div class="table-responsive">
                        <table class="table text-center align-middle">
                            <thead>
                                <tr>
                                    <th>วัน/เวลา</th>
                                    <th class="text-danger">BP</th>
                                    <th class="text-warning">Pulse</th>
                                    <th>จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <!-- ข้อมูลจะถูกเติมด้วย Javascript -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <h5 class="text-center text-muted mb-3"><i class="bi bi-activity"></i> แนวโน้มสัญญาณชีพ</h5>
                <div class="card p-3 mb-3"><div class="chart-container"><canvas id="chartSBP"></canvas></div></div>
                <div class="card p-3 mb-3"><div class="chart-container"><canvas id="chartDBP"></canvas></div></div>
                <div class="card p-3"><div class="chart-container"><canvas id="chartP"></canvas></div></div>
            </div>
        </div>

        <!-- 3. หน้าวิเคราะห์ -->
        <div class="tab-pane fade" id="pills-ai">
            <div class="card p-4">
                <h4 class="text-center mb-4" style="color: var(--mint-dark);"><i class="bi bi-robot"></i> AI วิเคราะห์สุขภาพ</h4>
                <div class="text-center mb-3">
                    <span class="badge bg-light text-dark border"><i class="bi bi-info-circle"></i> อ้างอิงเกณฑ์ AHA 2017</span>
                </div>
                <div id="aiContent"></div>
            </div>
        </div>

        <!-- 4. หน้าตั้งค่า -->
        <div class="tab-pane fade" id="pills-settings">
            <div class="card p-4">
                <h4 class="mb-4" style="color: var(--mint-dark);"><i class="bi bi-person-lines-fill"></i> ข้อมูลส่วนตัว</h4>
                <form id="settingsForm">
                    <div class="mb-3">
                        <label class="form-label">ชื่อเรียก / ชื่อเล่น</label>
                        <input type="text" class="form-control" id="settingName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">วัน/เดือน/ปีเกิด</label>
                        <input type="date" class="form-control" id="settingDOB" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">โรคประจำตัว (ถ้ามี)</label>
                        <input type="text" class="form-control" id="settingDisease" placeholder="เช่น ความดันโลหิตสูง, เบาหวาน">
                    </div>
                    <button type="submit" class="btn btn-custom w-100">
                        <i class="bi bi-save"></i> บันทึกการตั้งค่า
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz4ZS_9rWntw7fbl2oENr4osaAswx9JyC9G1PqIb652B392JNePHOEK2ceBTRSdk5g/exec';

    let chartPInstance = null;
    let chartSBPInstance = null;
    let chartDBPInstance = null;

    function loadSettings() {
        const name = localStorage.getItem('userName') || '';
        const dob = localStorage.getItem('userDOB') || '';
        const disease = localStorage.getItem('userDisease') || '';
        
        if(name) {
            document.getElementById('greetingText').innerHTML = `<i class="bi bi-person-heart"></i> สวัสดีคุณ${name}!`;
            document.getElementById('settingName').value = name;
        }
        if(disease) {
            document.getElementById('diseaseText').innerHTML = `🩺 โรคประจำตัว: ${disease}`;
            document.getElementById('settingDisease').value = disease;
        } else {
            document.getElementById('diseaseText').innerHTML = '';
        }
        if(dob) {
            document.getElementById('settingDOB').value = dob;
            checkBirthday(name, dob);
        }

        const currentYear = new Date().getFullYear();
        const yearSelect = document.getElementById('filterYear');
        yearSelect.innerHTML = '';
        for(let i = 0; i < 5; i++) {
            yearSelect.innerHTML += `<option value="${currentYear - i}">${currentYear - i}</option>`;
        }
    }

    function checkBirthday(name, dobStr) {
        const today = new Date();
        const dob = new Date(dobStr);
        if(today.getDate() === dob.getDate() && today.getMonth() === dob.getMonth()) {
            document.getElementById('bdName').textContent = name || 'ผู้ใช้งาน';
            document.getElementById('birthdayBanner').classList.remove('d-none');
        } else {
            document.getElementById('birthdayBanner').classList.add('d-none');
        }
    }

    document.getElementById('settingsForm').addEventListener('submit', (e) => {
        e.preventDefault();
        localStorage.setItem('userName', document.getElementById('settingName').value);
        localStorage.setItem('userDOB', document.getElementById('settingDOB').value);
        localStorage.setItem('userDisease', document.getElementById('settingDisease').value);
        Swal.fire({ title: 'สำเร็จ!', text: 'บันทึกการตั้งค่าส่วนตัวเรียบร้อยแล้ว', icon: 'success', confirmButtonColor: '#20c997' });
        loadSettings();
    });

    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('dateText').textContent = 'วันนี้ ' + new Date().toLocaleDateString('th-TH', options);
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('time').value = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

    async function fetchWeather() {
        try {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=13.86&longitude=100.52&current_weather=true');
            const data = await res.json();
            const temp = data.current_weather.temperature;
            const code = data.current_weather.weathercode;
            
            document.getElementById('tempText').textContent = `อุณหภูมิ ${temp}°C`;
            let suggestion = "อากาศแจ่มใส เหมาะกับการทำกิจกรรมครับ";
            let icon = "bi-cloud-sun";
            
            if (code >= 51 && code <= 99) { suggestion = "ฝนอาจจะตก อย่าลืมเตรียมร่มก่อนออกจากบ้านนะครับ ☔"; icon = "bi-cloud-rain"; } 
            else if (temp > 35) { suggestion = "อากาศร้อนจัด หลีกเลี่ยงแดดจัดเพื่อป้องกันฮีทสโตรก ☀️"; icon = "bi-sun"; }
            
            document.getElementById('weatherIcon').className = `bi ${icon} fs-1 me-3`;
            document.getElementById('weatherSuggestion').textContent = suggestion;
        } catch (e) {
            document.getElementById('tempText').textContent = "โหลดอากาศไม่สำเร็จ";
        }
    }

    document.getElementById('healthForm').addEventListener('submit', (e) => {
        e.preventDefault();
        Swal.fire({
            title: 'ยืนยันการบันทึกข้อมูล?',
            html: `ความดัน: <b>${document.getElementById('sbp').value} / ${document.getElementById('dbp').value}</b><br>Pulse: <b>${document.getElementById('p').value || '-'}</b>`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#20c997',
            cancelButtonColor: '#ff7675',
            confirmButtonText: '<i class="bi bi-check-circle"></i> บันทึกเลย',
            cancelButtonText: 'ยกเลิก'
        }).then(async (result) => {
            if (result.isConfirmed) {
                const submitBtn = document.getElementById('submitBtn');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...';
                submitBtn.disabled = true;

                const payload = {
                    id: Date.now(), 
                    date: document.getElementById('date').value,
                    time: document.getElementById('time').value,
                    rr: document.getElementById('rr').value,
                    p: document.getElementById('p').value,
                    sbp: document.getElementById('sbp').value,
                    dbp: document.getElementById('dbp').value,
                    note: document.getElementById('note').value
                };

                let history = JSON.parse(localStorage.getItem('healthHistory')) || [];
                history.push(payload);
                localStorage.setItem('healthHistory', JSON.stringify(history));

                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    Swal.fire({ title: 'บันทึกสำเร็จ!', text: 'ข้อมูลถูกบันทึกเรียบร้อยแล้ว', icon: 'success', confirmButtonColor: '#20c997' });
                    document.getElementById('rr').value = ''; document.getElementById('p').value = '';
                    document.getElementById('sbp').value = ''; document.getElementById('dbp').value = ''; document.getElementById('note').value = '';
                    
                    renderAIAnalysis(); renderHistory();
                } catch (error) {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                } finally {
                    submitBtn.innerHTML = originalText; submitBtn.disabled = false;
                }
            }
        });
    });

    // --- ฟังก์ชันแก้ไขข้อมูล ---
    function editRecord(id) {
        let history = JSON.parse(localStorage.getItem('healthHistory')) || [];
        let index = history.findIndex(item => item.id === id);
        if(index === -1) return;
        
        const item = history[index];
        
        Swal.fire({
            title: 'แก้ไขข้อมูลสัญญาณชีพ',
            html: `
                <div class="row text-start mt-3">
                    <div class="col-6 mb-2"><label class="form-label">SBP</label><input id="edit_sbp" type="number" class="form-control" value="${item.sbp}"></div>
                    <div class="col-6 mb-2"><label class="form-label">DBP</label><input id="edit_dbp" type="number" class="form-control" value="${item.dbp}"></div>
                    <div class="col-6 mb-2"><label class="form-label">Pulse</label><input id="edit_p" type="number" class="form-control" value="${item.p || ''}"></div>
                    <div class="col-6 mb-2"><label class="form-label">RR</label><input id="edit_rr" type="number" class="form-control" value="${item.rr || ''}"></div>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'บันทึกการแก้ไข',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#20c997',
            preConfirm: () => {
                return {
                    sbp: document.getElementById('edit_sbp').value,
                    dbp: document.getElementById('edit_dbp').value,
                    p: document.getElementById('edit_p').value,
                    rr: document.getElementById('edit_rr').value
                }
            }
        }).then((result) => {
            if (result.isConfirmed) {
                history[index].sbp = result.value.sbp;
                history[index].dbp = result.value.dbp;
                history[index].p = result.value.p;
                history[index].rr = result.value.rr;
                localStorage.setItem('healthHistory', JSON.stringify(history));
                
                Swal.fire({ title: 'อัปเดตสำเร็จ', text: 'ข้อมูลถูกปรับปรุงแล้ว', icon: 'success', confirmButtonColor: '#20c997', timer: 1500 });
                renderHistory();
                renderAIAnalysis();
            }
        });
    }

    // --- ฟังก์ชันลบข้อมูล ---
    function deleteRecord(id) {
        Swal.fire({
            title: 'ยืนยันการลบข้อมูล?',
            text: "หากลบแล้วจะไม่สามารถกู้คืนข้อมูลนี้ได้!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#64748b',
            confirmButtonText: '<i class="bi bi-trash"></i> ใช่, ลบเลย',
            cancelButtonText: 'ยกเลิก'
        }).then((result) => {
            if (result.isConfirmed) {
                let history = JSON.parse(localStorage.getItem('healthHistory')) || [];
                // กรองเอาเฉพาะข้อมูลที่ id ไม่ตรงกับตัวที่ถูกเลือกลบ (คือลบตัวนั้นออก)
                history = history.filter(item => item.id !== id);
                localStorage.setItem('healthHistory', JSON.stringify(history));
                
                Swal.fire({
                    title: 'ลบสำเร็จ!',
                    text: 'ข้อมูลถูกลบออกจากระบบแล้ว',
                    icon: 'success',
                    confirmButtonColor: '#20c997',
                    timer: 1500,
                    showConfirmButton: false
                });
                
                renderHistory();
                renderAIAnalysis();
            }
        });
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('healthHistory')) || [];
        let monthEl = document.getElementById('filterMonth'); let yearEl = document.getElementById('filterYear');
        
        if(!monthEl.dataset.initialized) {
            const now = new Date();
            monthEl.value = String(now.getMonth() + 1).padStart(2, '0');
            yearEl.value = String(now.getFullYear());
            monthEl.dataset.initialized = "true";
        }

        const fMonth = monthEl.value; const fYear = yearEl.value;
        const filteredData = history.filter(item => {
            if(!item.date) return false;
            const [y, m, d] = item.date.split('-');
            return y === fYear && m === fMonth;
        });

        const tbody = document.getElementById('historyTableBody');
        tbody.innerHTML = '';
        if(filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">ไม่มีข้อมูลในเดือนนี้</td></tr>';
        } else {
            filteredData.forEach(item => {
                const dateShort = item.date.split('-')[2] + '/' + item.date.split('-')[1];
                tbody.innerHTML += `
                    <tr>
                        <td><div class="fw-bold">${dateShort}</div><small class="text-muted">${item.time}</small></td>
                        <td><span class="text-danger fw-bold fs-6">${item.sbp}</span> / <span class="text-primary fw-bold fs-6">${item.dbp}</span></td>
                        <td class="text-warning fw-bold fs-6">${item.p || '-'}</td>
                        <td>
                            <button class="btn-edit" onclick="editRecord(${item.id})" title="แก้ไข"><i class="bi bi-pencil"></i></button>
                            <button class="btn-delete" onclick="deleteRecord(${item.id})" title="ลบ"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        const labels = filteredData.map(item => `${item.date.split('-')[2]} (${item.time})`);
        const dataSBP = filteredData.map(item => item.sbp);
        const dataDBP = filteredData.map(item => item.dbp);
        const dataP = filteredData.map(item => item.p || 0);

        if(chartSBPInstance) chartSBPInstance.destroy();
        if(chartDBPInstance) chartDBPInstance.destroy();
        if(chartPInstance) chartPInstance.destroy();

        const commonOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: false } } };

        chartSBPInstance = new Chart(document.getElementById('chartSBP'), {
            type: 'line', data: { labels: labels, datasets: [{ label: 'Systolic (ตัวบน)', data: dataSBP, borderColor: '#ff7675', backgroundColor: 'rgba(255, 118, 117, 0.1)', borderWidth: 3, tension: 0.4, fill: true }] }, options: commonOptions
        });
        chartDBPInstance = new Chart(document.getElementById('chartDBP'), {
            type: 'line', data: { labels: labels, datasets: [{ label: 'Diastolic (ตัวล่าง)', data: dataDBP, borderColor: '#74b9ff', backgroundColor: 'rgba(116, 185, 255, 0.1)', borderWidth: 3, tension: 0.4, fill: true }] }, options: commonOptions
        });
        chartPInstance = new Chart(document.getElementById('chartP'), {
            type: 'line', data: { labels: labels, datasets: [{ label: 'Pulse (ชีพจร)', data: dataP, borderColor: '#fdcb6e', backgroundColor: 'rgba(253, 203, 110, 0.1)', borderWidth: 3, tension: 0.4, fill: true }] }, options: commonOptions
        });
    }

    function renderAIAnalysis() {
        const history = JSON.parse(localStorage.getItem('healthHistory')) || [];
        const aiContent = document.getElementById('aiContent');
        if (history.length === 0) {
            aiContent.innerHTML = '<p class="text-center text-muted">ยังไม่มีข้อมูลสำหรับวิเคราะห์</p>';
            return;
        }

        const latest = history[history.length - 1];
        const sbp = parseInt(latest.sbp);
        const dbp = parseInt(latest.dbp);
        const p = parseInt(latest.p) || 0;
        
        let bpStatus = "ปกติ (Normal)"; let color = "text-success"; let icon = "bi-check-circle-fill";
        let bpAdvice = "ความดันอยู่ในเกณฑ์ดีมาก รักษาสุขภาพและออกกำลังกายสม่ำเสมอต่อไปนะครับ";
        
        if (sbp >= 180 || dbp >= 120) {
            bpStatus = "วิกฤต (Hypertensive Crisis)"; color = "text-danger"; icon = "bi-exclamation-octagon-fill";
            bpAdvice = `<strong>คำแนะนำฉุกเฉิน:</strong> ระดับความดันอันตรายมาก 🚨 หากมีอาการเจ็บหน้าอก หายใจลำบาก หรือเวียนศีรษะรุนแรง ควรรีบพบแพทย์หรือห้องฉุกเฉินทันที`;
        } else if (sbp >= 140 || dbp >= 90) {
            bpStatus = "สูงระดับ 2 (Stage 2)"; color = "text-danger"; icon = "bi-exclamation-triangle-fill";
            bpAdvice = `<strong>คำแนะนำ:</strong> ความดันโลหิตสูงอย่างมีนัยสำคัญ ควรงดอาหารเค็มจัด พักผ่อนให้เพียงพอ หากรับประทานยาอยู่ควรทานให้ตรงเวลาและปรึกษาแพทย์`;
        } else if (sbp >= 130 || dbp >= 80) {
            bpStatus = "สูงระดับ 1 (Stage 1)"; color = "text-warning"; icon = "bi-exclamation-circle-fill";
            bpAdvice = `<strong>คำแนะนำ:</strong> เริ่มมีภาวะความดันสูง แนะนำให้ออกกำลังกายแอโรบิค วันละ 30 นาที ลดอาหารรสจัด และควบคุมน้ำหนัก`;
        } else if (sbp >= 120 && dbp < 80) {
            bpStatus = "เริ่มสูง (Elevated)"; color = "text-info"; icon = "bi-info-circle-fill";
            bpAdvice = `<strong>คำแนะนำ:</strong> ความดันค่อนข้างปริ่มเกณฑ์มาตรฐาน ควรเริ่มปรับพฤติกรรมสุขภาพ ลดโซเดียมและออกกำลังกายสม่ำเสมอ`;
        } else if (sbp < 90 && sbp > 0) {
            bpStatus = "ต่ำ (Hypotension)"; color = "text-secondary"; icon = "bi-arrow-down-circle-fill";
            bpAdvice = `<strong>คำแนะนำ:</strong> ความดันค่อนข้างต่ำ หากมีอาการหน้ามืด วิงเวียนขณะลุกยืน แนะนำให้จิบน้ำหวาน ดื่มน้ำให้เพียงพอ และเปลี่ยนอิริยาบถช้าๆ`;
        }

        let hrText = "";
        if (p > 0) {
            if (p > 100) hrText = `<p class="mb-1"><i class="bi bi-heart-pulse text-warning"></i> <b>ชีพจร:</b> ${p} bpm (ค่อนข้างเร็ว - Tachycardia) ควรนั่งพักสักครู่</p>`;
            else if (p < 60) hrText = `<p class="mb-1"><i class="bi bi-heart-pulse text-info"></i> <b>ชีพจร:</b> ${p} bpm (ค่อนข้างช้า - Bradycardia)</p>`;
            else hrText = `<p class="mb-1"><i class="bi bi-heart-pulse text-success"></i> <b>ชีพจร:</b> ${p} bpm (อยู่ในเกณฑ์ปกติ 60-100 bpm)</p>`;
        }

        aiContent.innerHTML = `
            <div class="text-center mb-4">
                <p class="mb-1 text-muted">ข้อมูลล่าสุด: ${latest.date} เวลา ${latest.time}</p>
                <div class="display-4 fw-bold ${color} mb-2">${sbp} / ${dbp}</div>
                <h5 class="${color} mb-3"><i class="bi ${icon}"></i> สถานะ: ${bpStatus}</h5>
                ${hrText}
            </div>
            <div class="ai-box">
                <p class="mb-0 lh-lg">${bpAdvice}</p>
            </div>
        `;
    }

    window.onload = () => { loadSettings(); fetchWeather(); renderAIAnalysis(); renderHistory(); };
</script>
</body>
</html>
